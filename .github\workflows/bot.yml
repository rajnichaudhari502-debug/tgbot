name: Telegram Recorder Bot Runner

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub 6-hour max limit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space for 90m Capture
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone python3-pip
          pip3 install wzgram

      - name: Configure Rclone
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Launch Bot
        run: python3 bot.py
