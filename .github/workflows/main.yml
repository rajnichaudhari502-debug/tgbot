name: JIO Hilarious Bot Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wzgram requests

    - name: Install FFmpeg & Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg wget unzip

    - name: Install N_m3u8DL-RE & Shaka Packager
      run: |
        # Install N_m3u8DL-RE
        wget https://github.com/nilaoda/N_m3u8DL-RE/releases/download/v0.6.0-beta/N_m3u8DL-RE_v0.6.0-beta_linux-x64_20260629.tar.gz
        tar -xzf N_m3u8DL-RE_v0.6.0-beta_linux-x64_20260629.tar.gz
        sudo mv N_m3u8DL-RE /usr/local/bin/ || sudo find . -name "N_m3u8DL-RE" -type f -exec sudo cp {} /usr/local/bin/ \;
        sudo chmod +x /usr/local/bin/N_m3u8DL-RE

        # Install Shaka Packager with correct filename ('shaka-packager')
        wget -O shaka-packager https://github.com/shaka-project/shaka-packager/releases/download/v2.6.1/packager-linux-x64
        sudo mv shaka-packager /usr/local/bin/
        sudo chmod +x /usr/local/bin/shaka-packager

    - name: Run Telegram Bot
      env:
        PYTHONUNBUFFERED: "1"
        TERM: "xterm-256color"
      run: |
        rm -f *.session *.session-journal
        python bot2.py
